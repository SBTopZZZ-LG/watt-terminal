[package]
name = "agent-term"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
portable-pty = "=0.9.0"
vt100 = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Redaction of secrets in tool output and history (core/chat/redact.rs).
regex = "1"
# LLM provider adapter (core/llm). Default features give rustls (no OpenSSL / native-tls).
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
# Provider API keys and secret headers live in one Keychain item (core/settings/secrets.rs). Default features only:
# they give the macOS Keychain backend without OpenSSL / native-tls.
keyring = "4.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
