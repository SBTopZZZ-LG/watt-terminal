[package]
name = "watt-terminal"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "watt_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
portable-pty = "=0.9.0"
vt100 = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Attachments (core/chat/attachments, core/persist/attachments): content addresses (SHA-256) and the base64 of image
# bytes and of the data URLs sent to the model. Both versions are already in Cargo.lock, through tauri and reqwest.
sha2 = "0.10.9"
base64 = "0.23.1"
# Redaction of secrets in tool output and history (core/chat/redact.rs).
regex = "1"
# LLM provider adapter (core/llm). Default features give rustls (no OpenSSL / native-tls).
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
# Provider API keys and secret headers live in one Keychain item (core/settings/secrets.rs). Default features only:
# they give the macOS Keychain backend without OpenSSL / native-tls.
keyring = "4.2"
# One running instance (lib.rs run): a second launch focuses the first window and exits. Registered first.
tauri-plugin-single-instance = "=2.5.5"
# Saves the window's size, position and maximized state on exit and restores them at launch (lib.rs run).
# Latest 2.x release (tauri ^2.12). The 3.x line requires tauri 3.
tauri-plugin-window-state = "=2.5.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
