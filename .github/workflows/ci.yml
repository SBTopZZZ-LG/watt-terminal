# CI for Watt Terminal. Runs on pushes to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, no secrets are used.
permissions:
  contents: read

# Same shell on every OS (Git Bash on Windows).
defaults:
  run:
    shell: bash

jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build dependencies. zsh is needed by the unix-only zsh tests.
      # libdbus-1-dev is needed by libdbus-sys (pkg-config), pulled in through keyring.
      - name: Linux packages (Tauri, libdbus, zsh)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev zsh

      # tauri::generate_context needs ../dist (tauri.conf.json frontendDist),
      # which is gitignored, so build the frontend before any cargo step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Diagnostics only (no behaviour change): the zsh and OS the Linux runner has, to compare with the Debian container.
      - name: Linux diagnostics (zsh, OS)
        if: runner.os == 'Linux'
        run: |
          zsh --version
          which zsh
          cat /etc/os-release | head -3
          nproc
          ls -la /etc/zsh || true
          # Insecure zsh completion paths (info only), with owner and mode of each.
          zsh -fc 'autoload -U compaudit; compaudit' || true
          zsh -fc 'autoload -U compaudit; compaudit' 2>/dev/null | head -n 20 | xargs -r -d '\n' ls -ld || true

      # Ubuntu's /etc/zsh/zshrc runs compinit, which asks a y/n question on insecure completion
      # directories. An interactive test shell then never reaches its prompt, so the zsh tests hang.
      # Remove group/other write, and hand paths owned by neither root nor the runner user to root.
      # Never fails the job: whatever is still insecure is printed at the end.
      - name: Make zsh completion directories secure (Linux)
        if: runner.os == 'Linux'
        run: |
          list() { zsh -fc 'autoload -U compaudit; compaudit' 2>/dev/null || true; }
          list | xargs -r -d '\n' sudo chmod go-w -- || true
          list | while IFS= read -r p; do
            owner=$(stat -c %U -- "$p" 2>/dev/null || true)
            if [ -n "$owner" ] && [ "$owner" != root ] && [ "$owner" != "$(id -un)" ]; then
              sudo chown root -- "$p" || true
            fi
          done
          echo "Still insecure after fix:"
          list

      - name: Cargo tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast

  # Clean Debian bookworm with zsh 5.9, independent of the runner image. The Rust build needs ../dist,
  # so the frontend is built on the host first. The container steps are in scripts/test-all.mjs.
  linux-docker:
    name: linux-docker (Debian bookworm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Docker image build, clippy and cargo test
        run: node scripts/test-all.mjs --docker --only=docker-build,docker-test
