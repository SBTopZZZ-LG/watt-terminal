# CI for Watt Terminal. Runs on pushes to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time; a newer push cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token, no secrets are used.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

  backend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # tauri::generate_context needs ../dist (tauri.conf.json frontendDist),
      # which is gitignored, so build the frontend before any cargo step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo tests
        working-directory: src-tauri
        run: cargo test
